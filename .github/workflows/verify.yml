name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dev-only type-check dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Type-check the host and client halves
        run: npm run typecheck
      - name: Check syntax, version and structure regression
        run: node tools/verify.mjs
